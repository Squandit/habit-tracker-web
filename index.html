<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <!-- Google Fonts: Nunito for regular text, JetBrains Mono for the
         monospace bits (descriptions, loading message). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="page">
      <h1 class="page-title">Habit Tracker</h1>
      <div class="section-header">
          <h2 class="section-title">Current habits</h2>
          <button class="add-habit-button" id="add-habit">
            + Add Habit
        </button>
      </div>
        <!-- app.js clears and rebuilds everything inside this div on
             every load, the message below only shows briefly before
             the real habit cards replace it. -->
        <div class="habit-list" id="habit-list" aria-live="polite">
            <p class="habit-list-message">Loading habits...</p>
            <!-- Leftover from an earlier attempt, unused now that each
                 habit gets its own real checkbox built in app.js.
                 Safe to delete. -->
            <span class="habit-checkbox" id="habit-checkbox"></span>
        </div>
      </div>
    <!-- These two need to load BEFORE app.js, since app.js calls
         anime() and confetti() directly and they need to already
         exist as global functions by the time it runs. -->
    <script src="https://cdn.jsdelivr.net/npm/animejs@3/lib/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1/dist/confetti.browser.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
